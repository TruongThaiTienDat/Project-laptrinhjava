name: AI Drift Detection Workflow

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'ai-engine/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'ai-engine/**'

jobs:
  drift-check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Check AI Data Drift & Schema
        run: |
          echo "Checking AI Engine model drift and pipeline requirements..."
          if [ -d "ai-engine" ]; then
            cd ai-engine
            if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          fi
          echo "AI Drift Detection check completed successfully."