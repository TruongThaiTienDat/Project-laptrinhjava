version: '3.8'

services:
  # Database PostgreSQL cho Backend Java
  postgres:
    image: postgres:15-alpine
    container_name: livingdocs-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: livingdocs_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Caching service Redis
  redis:
    image: redis:7-alpine
    container_name: livingdocs-redis
    ports:
      - "6379:6379"

  # Zookeeper phục vụ Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: livingdocs-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  # Event Streaming Kafka
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: livingdocs-kafka
    ports:
      - "9092:9092"
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # Cho phép tự động khởi tạo Topic và Dead Letter Queue (DLQ)
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  # Giao diện Kafka UI - Quản lý Kafka Topics & Theo dõi Dead Letter Queue (DLQ)
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: livingdocs-kafka-ui
    ports:
      - "8085:8080"
    depends_on:
      - kafka
    environment:
      KAFKA_CLUSTERS_0_NAME: livingdocs-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181

  # AI Engine (Python FastAPI) - Backend gọi qua http://ai-engine:8000
  ai-engine:
    build: ./ai-engine
    container_name: livingdocs-ai-engine
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: